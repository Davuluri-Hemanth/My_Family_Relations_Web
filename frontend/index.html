<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family Relations</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="app"><header><h1>My Family Relations</h1><button id="logout" class="danger hidden">Logout</button></header>
<section id="login" class="card"><h2>Welcome to Family Relations</h2><p class="muted">Sign in with your full name and mobile or Mail ID.</p><input id="name" placeholder="Full Name" autocomplete="name"><input id="identifier" placeholder="Mobile or Mail ID"><button onclick="login()">Enter</button><p id="loginmsg" class="error"></p></section>
<section id="dashboard" class="hidden"><div class="card hero"><div><h2 id="welcome"></h2><p id="role"></p></div><button onclick="loadMe()">Refresh</button></div>
<div class="grid"><div class="card"><h3>My Profile</h3><div id="profile"></div><button onclick="editMe()">Edit My Profile</button><input id="photo" type="file" accept="image/*"><button onclick="uploadPhoto()">Upload Photo</button></div>
<div class="card"><h3>Find Family Members</h3><select id="relFilter"><option>All</option><option>Father</option><option>Mother</option><option>Spouse</option><option>Son</option><option>Daughter</option><option>Brother</option><option>Sister</option><option>Grandfather</option><option>Grandmother</option><option>Uncle</option><option>Aunt</option><option>Cousin</option><option>Nephew</option><option>Niece</option><option>Other</option></select><button onclick="findMembers()">Find Members</button><div id="relations"></div></div>
<div class="card"><h3>Find Relation</h3><input id="target" placeholder="Person name"><button onclick="findRelation()">Find Relation</button><div id="relationResult"></div></div>
<div id="admin" class="card hidden"><h3>Admin: Family Members</h3><button onclick="loadAll()">Load Members</button><button onclick="showAdd()">Add Member</button><div id="allMembers"></div></div></div></section></div>
<div id="modal" class="modal hidden"><div class="modalbox"><h3 id="modalTitle"></h3><div id="modalBody"></div><button onclick="closeModal()">Close</button></div></div>
<script src="/app.js"></script></body></html>
